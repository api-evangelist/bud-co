naftiko: 1.0.0-alpha2
info:
  label: Bud Platform - Customers
  description: Create and manage end-customer records on the Bud platform.
  tags:
  - Bud
  - Customers
  created: '2026-05-25'
  modified: '2026-05-25'
binds:
- namespace: env
  keys:
    BUD_ACCESS_TOKEN: BUD_ACCESS_TOKEN
capability:
  consumes:
  - type: http
    namespace: platform-customers
    baseUri: https://api-sandbox.thisisbud.com
    description: Bud Platform - Customers business capability. OAuth2 bearer-token authenticated against the Bud platform.
    resources:
    - name: create-customer
      path: /platform/v3/customers
      operations:
      - name: create-customer
        method: POST
        description: Bud Platform - Customers operation against Bud.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: Authorization
      value: 'Bearer {{env.BUD_ACCESS_TOKEN}}'
      placement: header
  exposes:
  - type: rest
    namespace: platform-customers-rest
    port: 8080
    description: REST adapter for Bud Platform - Customers. One Spectral-compliant resource per consumed operation.
    resources:
    - path: /v1/platform/v3/customers
      name: create-customer
      description: REST surface for create-customer.
      operations:
      - method: POST
        name: create-customer
        description: Bud Platform - Customers
        call: platform-customers.create-customer
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: platform-customers-mcp
    port: 9090
    transport: http
    description: MCP adapter for Bud Platform - Customers. One tool per consumed operation.
    tools:
    - name: bud-create-customer
      description: Bud Platform - Customers
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: platform-customers.create-customer
      outputParameters:
      - type: object
        mapping: $.
