naftiko: 1.0.0-alpha2
info:
  label: Bud Insights - Actionable
  description: Retrieve actionable balance, income, and spending insights for a customer.
  tags:
  - Bud
  - Insights
  created: '2026-05-25'
  modified: '2026-05-25'
binds:
- namespace: env
  keys:
    BUD_ACCESS_TOKEN: BUD_ACCESS_TOKEN
capability:
  consumes:
  - type: http
    namespace: insights-actionable
    baseUri: https://api-sandbox.thisisbud.com
    description: Bud Insights - Actionable business capability. OAuth2 bearer-token authenticated against the Bud platform.
    resources:
    - name: list-actionable-balance-insights
      path: /insights/v1/actionable/balances
      operations:
      - name: list-actionable-balance-insights
        method: GET
        description: Bud Insights - Actionable operation against Bud.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: Authorization
      value: 'Bearer {{env.BUD_ACCESS_TOKEN}}'
      placement: header
  exposes:
  - type: rest
    namespace: insights-actionable-rest
    port: 8080
    description: REST adapter for Bud Insights - Actionable. One Spectral-compliant resource per consumed operation.
    resources:
    - path: /v1/insights/v1/actionable/balances
      name: list-actionable-balance-insights
      description: REST surface for list-actionable-balance-insights.
      operations:
      - method: GET
        name: list-actionable-balance-insights
        description: Bud Insights - Actionable
        call: insights-actionable.list-actionable-balance-insights
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: insights-actionable-mcp
    port: 9090
    transport: http
    description: MCP adapter for Bud Insights - Actionable. One tool per consumed operation.
    tools:
    - name: bud-list-actionable-balance-insights
      description: Bud Insights - Actionable
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: insights-actionable.list-actionable-balance-insights
      outputParameters:
      - type: object
        mapping: $.
