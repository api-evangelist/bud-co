naftiko: 1.0.0-alpha2
info:
  label: Bud Insights - Custom
  description: Manage custom insight definitions and retrieve customer-specific custom insights.
  tags:
  - Bud
  - Insights
  created: '2026-05-25'
  modified: '2026-05-25'
binds:
- namespace: env
  keys:
    BUD_ACCESS_TOKEN: BUD_ACCESS_TOKEN
capability:
  consumes:
  - type: http
    namespace: insights-custom
    baseUri: https://api-sandbox.thisisbud.com
    description: Bud Insights - Custom business capability. OAuth2 bearer-token authenticated against the Bud platform.
    resources:
    - name: list-custom-insights
      path: /insights/v1/custom/manage
      operations:
      - name: list-custom-insights
        method: GET
        description: Bud Insights - Custom operation against Bud.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: Authorization
      value: 'Bearer {{env.BUD_ACCESS_TOKEN}}'
      placement: header
  exposes:
  - type: rest
    namespace: insights-custom-rest
    port: 8080
    description: REST adapter for Bud Insights - Custom. One Spectral-compliant resource per consumed operation.
    resources:
    - path: /v1/insights/v1/custom/manage
      name: list-custom-insights
      description: REST surface for list-custom-insights.
      operations:
      - method: GET
        name: list-custom-insights
        description: Bud Insights - Custom
        call: insights-custom.list-custom-insights
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: insights-custom-mcp
    port: 9090
    transport: http
    description: MCP adapter for Bud Insights - Custom. One tool per consumed operation.
    tools:
    - name: bud-list-custom-insights
      description: Bud Insights - Custom
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: insights-custom.list-custom-insights
      outputParameters:
      - type: object
        mapping: $.
