naftiko: 1.0.0-alpha2
info:
  label: Bud Enrichment - Merchants
  description: Retrieve aggregated merchant totals for a customer.
  tags:
  - Bud
  - Merchants
  created: '2026-05-25'
  modified: '2026-05-25'
binds:
- namespace: env
  keys:
    BUD_ACCESS_TOKEN: BUD_ACCESS_TOKEN
capability:
  consumes:
  - type: http
    namespace: enrichment-merchants
    baseUri: https://api-sandbox.thisisbud.com
    description: Bud Enrichment - Merchants business capability. OAuth2 bearer-token authenticated against the Bud platform.
    resources:
    - name: list-merchant-totals
      path: /v2/merchants/totals
      operations:
      - name: list-merchant-totals
        method: GET
        description: Bud Enrichment - Merchants operation against Bud.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: Authorization
      value: 'Bearer {{env.BUD_ACCESS_TOKEN}}'
      placement: header
  exposes:
  - type: rest
    namespace: enrichment-merchants-rest
    port: 8080
    description: REST adapter for Bud Enrichment - Merchants. One Spectral-compliant resource per consumed operation.
    resources:
    - path: /v1/v2/merchants/totals
      name: list-merchant-totals
      description: REST surface for list-merchant-totals.
      operations:
      - method: GET
        name: list-merchant-totals
        description: Bud Enrichment - Merchants
        call: enrichment-merchants.list-merchant-totals
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: enrichment-merchants-mcp
    port: 9090
    transport: http
    description: MCP adapter for Bud Enrichment - Merchants. One tool per consumed operation.
    tools:
    - name: bud-list-merchant-totals
      description: Bud Enrichment - Merchants
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: enrichment-merchants.list-merchant-totals
      outputParameters:
      - type: object
        mapping: $.
