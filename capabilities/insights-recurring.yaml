naftiko: 1.0.0-alpha2
info:
  label: Bud Insights - Recurring
  description: Identify recurring transactions, subscriptions, and forecasted future transactions for a customer.
  tags:
  - Bud
  - Recurring Payments
  created: '2026-05-25'
  modified: '2026-05-25'
binds:
- namespace: env
  keys:
    BUD_ACCESS_TOKEN: BUD_ACCESS_TOKEN
capability:
  consumes:
  - type: http
    namespace: insights-recurring
    baseUri: https://api-sandbox.thisisbud.com
    description: Bud Insights - Recurring business capability. OAuth2 bearer-token authenticated against the Bud platform.
    resources:
    - name: list-recurring-transactions
      path: /v1/regular-transactions
      operations:
      - name: list-recurring-transactions
        method: GET
        description: Bud Insights - Recurring operation against Bud.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: Authorization
      value: 'Bearer {{env.BUD_ACCESS_TOKEN}}'
      placement: header
  exposes:
  - type: rest
    namespace: insights-recurring-rest
    port: 8080
    description: REST adapter for Bud Insights - Recurring. One Spectral-compliant resource per consumed operation.
    resources:
    - path: /v1/v1/regular-transactions
      name: list-recurring-transactions
      description: REST surface for list-recurring-transactions.
      operations:
      - method: GET
        name: list-recurring-transactions
        description: Bud Insights - Recurring
        call: insights-recurring.list-recurring-transactions
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: insights-recurring-mcp
    port: 9090
    transport: http
    description: MCP adapter for Bud Insights - Recurring. One tool per consumed operation.
    tools:
    - name: bud-list-recurring-transactions
      description: Bud Insights - Recurring
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: insights-recurring.list-recurring-transactions
      outputParameters:
      - type: object
        mapping: $.
