naftiko: 1.0.0-alpha2
info:
  label: Bud Affordability - Reports
  description: Generate an affordability report (income, expenditure, disposable income) for a customer for lending decisions.
  tags:
  - Bud
  - Affordability
  created: '2026-05-25'
  modified: '2026-05-25'
binds:
- namespace: env
  keys:
    BUD_ACCESS_TOKEN: BUD_ACCESS_TOKEN
capability:
  consumes:
  - type: http
    namespace: affordability-reports
    baseUri: https://api-sandbox.thisisbud.com
    description: Bud Affordability - Reports business capability. OAuth2 bearer-token authenticated against the Bud platform.
    resources:
    - name: get-affordability-report
      path: /affordability/v2/report
      operations:
      - name: get-affordability-report
        method: GET
        description: Bud Affordability - Reports operation against Bud.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: Authorization
      value: 'Bearer {{env.BUD_ACCESS_TOKEN}}'
      placement: header
  exposes:
  - type: rest
    namespace: affordability-reports-rest
    port: 8080
    description: REST adapter for Bud Affordability - Reports. One Spectral-compliant resource per consumed operation.
    resources:
    - path: /v1/affordability/v2/report
      name: get-affordability-report
      description: REST surface for get-affordability-report.
      operations:
      - method: GET
        name: get-affordability-report
        description: Bud Affordability - Reports
        call: affordability-reports.get-affordability-report
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: affordability-reports-mcp
    port: 9090
    transport: http
    description: MCP adapter for Bud Affordability - Reports. One tool per consumed operation.
    tools:
    - name: bud-get-affordability-report
      description: Bud Affordability - Reports
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: affordability-reports.get-affordability-report
      outputParameters:
      - type: object
        mapping: $.
