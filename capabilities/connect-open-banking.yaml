naftiko: 1.0.0-alpha2
info:
  label: Bud Connect - Open Banking
  description: Initiate, list and manage Open Banking provider connections via Bud's unified ASPSP gateway.
  tags:
  - Bud
  - Open Banking
  created: '2026-05-25'
  modified: '2026-05-25'
binds:
- namespace: env
  keys:
    BUD_ACCESS_TOKEN: BUD_ACCESS_TOKEN
capability:
  consumes:
  - type: http
    namespace: connect-open-banking
    baseUri: https://api-sandbox.thisisbud.com
    description: Bud Connect - Open Banking business capability. OAuth2 bearer-token authenticated against the Bud platform.
    resources:
    - name: create-authorisation-gateway-url
      path: /v2/open-banking/authorisation-gateway-url
      operations:
      - name: create-authorisation-gateway-url
        method: POST
        description: Bud Connect - Open Banking operation against Bud.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: Authorization
      value: 'Bearer {{env.BUD_ACCESS_TOKEN}}'
      placement: header
  exposes:
  - type: rest
    namespace: connect-open-banking-rest
    port: 8080
    description: REST adapter for Bud Connect - Open Banking. One Spectral-compliant resource per consumed operation.
    resources:
    - path: /v1/v2/open-banking/authorisation-gateway-url
      name: create-authorisation-gateway-url
      description: REST surface for create-authorisation-gateway-url.
      operations:
      - method: POST
        name: create-authorisation-gateway-url
        description: Bud Connect - Open Banking
        call: connect-open-banking.create-authorisation-gateway-url
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: connect-open-banking-mcp
    port: 9090
    transport: http
    description: MCP adapter for Bud Connect - Open Banking. One tool per consumed operation.
    tools:
    - name: bud-create-authorisation-gateway-url
      description: Bud Connect - Open Banking
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: connect-open-banking.create-authorisation-gateway-url
      outputParameters:
      - type: object
        mapping: $.
