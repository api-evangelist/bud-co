naftiko: 1.0.0-alpha2
info:
  label: Bud Payments - Standing Order
  description: Initiate, authorise, confirm, and retrieve a standing order payment.
  tags:
  - Bud
  - Payments
  created: '2026-05-25'
  modified: '2026-05-25'
binds:
- namespace: env
  keys:
    BUD_ACCESS_TOKEN: BUD_ACCESS_TOKEN
capability:
  consumes:
  - type: http
    namespace: payments-standing-order
    baseUri: https://api-sandbox.thisisbud.com
    description: Bud Payments - Standing Order business capability. OAuth2 bearer-token authenticated against the Bud platform.
    resources:
    - name: initiate-standing-order
      path: /v1/payments/standing-order
      operations:
      - name: initiate-standing-order
        method: POST
        description: Bud Payments - Standing Order operation against Bud.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: Authorization
      value: 'Bearer {{env.BUD_ACCESS_TOKEN}}'
      placement: header
  exposes:
  - type: rest
    namespace: payments-standing-order-rest
    port: 8080
    description: REST adapter for Bud Payments - Standing Order. One Spectral-compliant resource per consumed operation.
    resources:
    - path: /v1/v1/payments/standing-order
      name: initiate-standing-order
      description: REST surface for initiate-standing-order.
      operations:
      - method: POST
        name: initiate-standing-order
        description: Bud Payments - Standing Order
        call: payments-standing-order.initiate-standing-order
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: payments-standing-order-mcp
    port: 9090
    transport: http
    description: MCP adapter for Bud Payments - Standing Order. One tool per consumed operation.
    tools:
    - name: bud-initiate-standing-order
      description: Bud Payments - Standing Order
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: payments-standing-order.initiate-standing-order
      outputParameters:
      - type: object
        mapping: $.
