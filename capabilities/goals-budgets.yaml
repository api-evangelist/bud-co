naftiko: 1.0.0-alpha2
info:
  label: Bud Goals - Budgets
  description: Create and manage customer spending budgets with attached contributing transactions.
  tags:
  - Bud
  - Budgets
  created: '2026-05-25'
  modified: '2026-05-25'
binds:
- namespace: env
  keys:
    BUD_ACCESS_TOKEN: BUD_ACCESS_TOKEN
capability:
  consumes:
  - type: http
    namespace: goals-budgets
    baseUri: https://api-sandbox.thisisbud.com
    description: Bud Goals - Budgets business capability. OAuth2 bearer-token authenticated against the Bud platform.
    resources:
    - name: list-spending-budgets
      path: /goals/v1/spending-budgets
      operations:
      - name: list-spending-budgets
        method: GET
        description: Bud Goals - Budgets operation against Bud.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: Authorization
      value: 'Bearer {{env.BUD_ACCESS_TOKEN}}'
      placement: header
  exposes:
  - type: rest
    namespace: goals-budgets-rest
    port: 8080
    description: REST adapter for Bud Goals - Budgets. One Spectral-compliant resource per consumed operation.
    resources:
    - path: /v1/goals/v1/spending-budgets
      name: list-spending-budgets
      description: REST surface for list-spending-budgets.
      operations:
      - method: GET
        name: list-spending-budgets
        description: Bud Goals - Budgets
        call: goals-budgets.list-spending-budgets
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: goals-budgets-mcp
    port: 9090
    transport: http
    description: MCP adapter for Bud Goals - Budgets. One tool per consumed operation.
    tools:
    - name: bud-list-spending-budgets
      description: Bud Goals - Budgets
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: goals-budgets.list-spending-budgets
      outputParameters:
      - type: object
        mapping: $.
