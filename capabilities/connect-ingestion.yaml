naftiko: 1.0.0-alpha2
info:
  label: Bud Connect - Refresh
  description: Refresh data on an existing Open Banking connection and track the asynchronous refresh task.
  tags:
  - Bud
  - Open Banking
  created: '2026-05-25'
  modified: '2026-05-25'
binds:
- namespace: env
  keys:
    BUD_ACCESS_TOKEN: BUD_ACCESS_TOKEN
capability:
  consumes:
  - type: http
    namespace: connect-refresh
    baseUri: https://api-sandbox.thisisbud.com
    description: Bud Connect - Refresh business capability. OAuth2 bearer-token authenticated against the Bud platform.
    resources:
    - name: initiate-refresh
      path: /open-banking/v2/refresh
      operations:
      - name: initiate-refresh
        method: POST
        description: Bud Connect - Refresh operation against Bud.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: Authorization
      value: 'Bearer {{env.BUD_ACCESS_TOKEN}}'
      placement: header
  exposes:
  - type: rest
    namespace: connect-refresh-rest
    port: 8080
    description: REST adapter for Bud Connect - Refresh. One Spectral-compliant resource per consumed operation.
    resources:
    - path: /v1/open-banking/v2/refresh
      name: initiate-refresh
      description: REST surface for initiate-refresh.
      operations:
      - method: POST
        name: initiate-refresh
        description: Bud Connect - Refresh
        call: connect-refresh.initiate-refresh
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: connect-refresh-mcp
    port: 9090
    transport: http
    description: MCP adapter for Bud Connect - Refresh. One tool per consumed operation.
    tools:
    - name: bud-initiate-refresh
      description: Bud Connect - Refresh
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: connect-refresh.initiate-refresh
      outputParameters:
      - type: object
        mapping: $.
