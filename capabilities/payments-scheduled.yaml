naftiko: 1.0.0-alpha2
info:
  label: Bud Payments - Scheduled
  description: Initiate, authorise, confirm, and retrieve a scheduled future payment.
  tags:
  - Bud
  - Payments
  created: '2026-05-25'
  modified: '2026-05-25'
binds:
- namespace: env
  keys:
    BUD_ACCESS_TOKEN: BUD_ACCESS_TOKEN
capability:
  consumes:
  - type: http
    namespace: payments-scheduled
    baseUri: https://api-sandbox.thisisbud.com
    description: Bud Payments - Scheduled business capability. OAuth2 bearer-token authenticated against the Bud platform.
    resources:
    - name: initiate-scheduled-payment
      path: /v1/payments/scheduled
      operations:
      - name: initiate-scheduled-payment
        method: POST
        description: Bud Payments - Scheduled operation against Bud.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: Authorization
      value: 'Bearer {{env.BUD_ACCESS_TOKEN}}'
      placement: header
  exposes:
  - type: rest
    namespace: payments-scheduled-rest
    port: 8080
    description: REST adapter for Bud Payments - Scheduled. One Spectral-compliant resource per consumed operation.
    resources:
    - path: /v1/v1/payments/scheduled
      name: initiate-scheduled-payment
      description: REST surface for initiate-scheduled-payment.
      operations:
      - method: POST
        name: initiate-scheduled-payment
        description: Bud Payments - Scheduled
        call: payments-scheduled.initiate-scheduled-payment
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: payments-scheduled-mcp
    port: 9090
    transport: http
    description: MCP adapter for Bud Payments - Scheduled. One tool per consumed operation.
    tools:
    - name: bud-initiate-scheduled-payment
      description: Bud Payments - Scheduled
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: payments-scheduled.initiate-scheduled-payment
      outputParameters:
      - type: object
        mapping: $.
