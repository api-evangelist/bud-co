description: Domain vocabulary for the Bud Financial platform - Open Banking aggregation, transaction
  enrichment, affordability assessment, and payment initiation.
dimensions:
- name: Products
  description: The top-level commercial products that Bud offers.
  terms:
  - id: connect
    label: Connect
    description: Open Banking aggregation and first-party ingestion.
  - id: intelligence
    label: Intelligence
    description: Enrichment, insights, categorization, characteristics, and search.
  - id: assess
    label: Assess
    description: Affordability and lending decision support.
  - id: pay
    label: Pay
    description: PISP payment initiation.
  - id: check
    label: Check
    description: KYC and verification.
