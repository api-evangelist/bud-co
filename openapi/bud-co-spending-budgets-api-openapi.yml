      description: "The day for which results are to be retrieved in the format [RFC 3339](https://www.rfc-editor.org/rfc/rfc3339).\n\nExamples:\n  - `2023-01-17T17:29:51Z`\n  - `2023-01-17T17:29:51-08:00`\n"
    parameters-QueryBudPageSize:
      in: query
      name: page_size
      schema:
        type: integer
      example: 200
      description: Use this parameter to set the maximum number of results to be returned. This defaults to 100, and has a maximum of 200.
    PathSpendingBudgetID:
      name: budget_id
      in: path
      schema:
        type: string
      required: true
