openapi: 3.2.0
info:
  title: 'Bud API Services: Documentation Spending Budgets API'
  version: 2.10.10
  description: '# Overview


    ## Introduction

    Welcome to Bud''s API Platform documentation.'
  contact:
    name: Bud Support
    email: help@thisisbud.com
    url: https://www.thisisbud.com/
  x-logo:
    url: data:image/png;base64,
servers:
- url: https://api-sandbox.thisisbud.com
tags:
- name: Spending Budgets
  x-displayName: Spending Budgets
  description: Spending budgets management API.
paths:
  /goals/v1/spending-budgets:
    post:
      tags:
      - Spending Budgets
      summary: Create Spending Budget
      description: Create a spending budget.
      operationId: goals_v1_spending_budgets_post
      security:
      - OAuth2: []
      parameters:
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/CustomerId'
      - $ref: '#/components/parameters/CustomerIdempotentIdentifier'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSpendingBudgetRequest'
            example:
              name: Travel Budget
              amount:
                value: '300.00'
                currency: GBP
              recurrency:
                period: monthly
                starting_day: 1
              include:
                categories:
                - l1: travel
                merchants:
                  slugs:
                  - uber
      responses:
        '201':
          description: Created - The budget was created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSpendingBudgetResponse'
              example:
                operation_id: goals_v1_spending_budgets_post
                data:
                  id: f46d76c4-56d3-11ee-ac69-d6df71eb5902
                  name: Travel Budget
                  amount:
                    value: '300.00'
                    currency: GBP
                  recurrency:
                    period: monthly
                    starting_day: 1
                  include:
                    categories:
                    - l1: travel
                    merchants:
                      slugs:
                      - uber
                  spent:
                    from: '2023-10-19'
                    to: '2023-10-31'
                    amount:
                      value: '160.59'
                      currency: GBP
                    ratio: '0.54'
                  created_at: '2023-10-03T09:20:30Z'
                  _links:
                    transactions: /goals/v1/spending-budgets/f46d76c4-56d3-11ee-ac69-d6df71eb5902/transactions
        '400':
          description: The request contains an invalid payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '401':
          description: Unauthorized - The request was not authorised.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
        '500':
          description: Internal Server Error - An unexpected error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
    get:
      tags:
      - Spending Budgets
      summary: Retrieve Spending Budgets
      description: 'Retrieve all spending budgets.


        Accounts IDs can be supplied as part of the URL query to return budgets with values filtered to the accounts IDs supplied. These budgets''

        spent amounts will only consider transactions associated with the specified accounts.

        If no account IDs are specified, the returned budgets will have a value combined from transactions across all of the customer''s accounts.'
      operationId: goals_v1_spending_budgets_get
      security:
      - OAuth2: []
      parameters:
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/CustomerId'
      - $ref: '#/components/parameters/CustomerIdempotentIdentifier'
      - $ref: '#/components/parameters/QueryBudAccountID'
      - $ref: '#/components/parameters/QueryDay'
      responses:
        '200':
          description: OK - The spending budgets were retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveSpendingBudgetsResponse'
        '400':
          description: The request contains an invalid payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '401':
          description: Unauthorized - The request was not authorised.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
        '500':
          description: Internal Server Error - An unexpected error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
    delete:
      tags:
      - Spending Budgets
      summary: Delete all Spending Budgets
      description: Delete all of a customers' spending budgets.
      operationId: goals_v1_spending_budgets_delete_all
      security:
      - OAuth2: []
      parameters:
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/CustomerId'
      - $ref: '#/components/parameters/CustomerIdempotentIdentifier'
      responses:
        '204':
          description: No Content - The budgets were removed successfully.
        '401':
          description: Unauthorized - The request was not authorised.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
        '404':
          description: Not Found - The customer has no budgets to be deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
        '500':
          description: Internal Server Error - An unexpected error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
  /goals/v1/spending-budgets/{budget_id}:
    patch:
      tags:
      - Spending Budgets
      summary: Patch a Spending Budget
      description: Update a Spending Budget with a given `budget_id`.
      operationId: goals_v1_spending_budgets_patch
      security:
      - OAuth2: []
      parameters:
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/CustomerId'
      - $ref: '#/components/parameters/CustomerIdempotentIdentifier'
      - $ref: '#/components/parameters/PathSpendingBudgetID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchSpendingBudget'
      responses:
        '200':
          description: OK - The budget was updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateSpendingBudgetResponse'
              example:
                operation_id: goals_v1_spending_budgets_patch
                data:
                  id: f46d76c4-56d3-11ee-ac69-d6df71eb5902
                  name: Travel Budget
                  amount:
                    value: '300.00'
                    currency: GBP
                  recurrency:
                    period: monthly
                    starting_day: 1
                  include:
                    categories:
                    - l1: travel
                    merchants:
                      slugs:
                      - uber
                  spent:
                    from: '2023-10-19'
                    to: '2023-10-31'
                    amount:
                      value: '160.59'
                      currency: GBP
                    ratio: '0.54'
                  created_at: '2023-10-03T09:20:30Z'
                  _links:
                    transactions: /goals/v1/spending-budgets/f46d76c4-56d3-11ee-ac69-d6df71eb5902/transactions
        '400':
          description: The request contains an invalid payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '401':
          description: Unauthorized - The request was not authorised.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
        '404':
          description: Not Found - The goal ID could not be found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
        '500':
          description: Internal Server Error - An unexpected error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
    delete:
      tags:
      - Spending Budgets
      summary: Delete a Spending Budget
      description: Delete a specific spending budget with the given `budget_id`
      operationId: goals_v1_spending_budgets_delete
      security:
      - OAuth2: []
      parameters:
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/CustomerId'
      - $ref: '#/components/parameters/CustomerIdempotentIdentifier'
      - $ref: '#/components/parameters/PathSpendingBudgetID'
      responses:
        '204':
          description: No Content - The budget was removed successfully.
        '401':
          description: Unauthorized - The request was not authorised.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
        '404':
          description: Not Found - The budget could not be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
        '500':
          description: Internal Server Error - An unexpected error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
  /goals/v1/spending-budgets/{budget_id}/transactions:
    get:
      tags:
      - Spending Budgets
      summary: Retrieve Spending Budget Transactions
      description: 'Retrieve all of the transactions associated with a spending budget. The results of this endpoint are paginated with a default page size of `100` and a maximum of `200`.

        The page size is configurable by the `page_size` query parameter.

        The next page of results can be retrieved using the `page_token` query parameter.


        Account IDs can be supplied as part of the URL query to filter transactions to those only associated with the specified accounts.

        If no account IDs are specified, we will return transactions associated with all of the customer''s accounts, relevant to the spending budget.'
      operationId: goals_v1_spending_budget_transactions_get
      security:
      - OAuth2: []
      parameters:
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/CustomerId'
      - $ref: '#/components/parameters/CustomerIdempotentIdentifier'
      - $ref: '#/components/parameters/PathSpendingBudgetID'
      - $ref: '#/components/parameters/QueryDay'
      - $ref: '#/components/parameters/parameters-QueryBudPageToken'
      - $ref: '#/components/parameters/parameters-QueryBudPageSize'
      - $ref: '#/components/parameters/QueryBudAccountID'
      responses:
        '200':
          description: OK - The spending budget transactions were retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveSpendingBudgetTransactionsResponse'
              example:
                operation_id: goals_v1_spending_budget_transactions_get
                data:
                - transaction_id: fbdc28e82f0f137586a526a88ec4a6be
                  account_id: RxsYshVGded4JeilkXgWKdXA
                  provider: BankOfBud
                  description: uber taxi
                  credit_debit_indicator: debit
                  status: booked
                  amount:
                    value: '16.39'
                    currency: GBP
                  date_time: '2023-10-03T10:00:00Z'
                  enrichments:
                    categories:
                      l1:
                        slug: transport
                        confidence: '0.99'
                      l2:
                        slug: taxi
                        confidence: '0.99'
                    merchant:
                      id: 9f345fcb-d1ee-4e79-a23e-510fb8dbd61f
                      slug: uber
                      display_name: Uber
                      logo: https://url/uber_logo.jpeg
                  suggested_description: Uber
                metadata:
                  results: 1
                  page_token: 
                  page_size: 100
                  budget_id: 19d1def3-5860-11ee-9342-3e1d60bc76f9
        '400':
          description: The request contains an invalid payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '401':
          description: Unauthorized - The request was not authorised.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
        '500':
          description: Internal Server Error - An unexpected error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
components:
  schemas:
    BadRequestResponse:
      title: Bad Request Response
      type: object
      description: Expected response structure
      required:
      - operation_id
      - code_id
      - message
      - errors
      properties:
        operation_id:
          $ref: '#/components/schemas/OperationId'
        code_id:
          type: string
          description: A descriptive enough string that is linked to the reason for the error.
        message:
          type: string
        errors:
          anyOf:
          - $ref: '#/components/schemas/Error'
          - $ref: '#/components/schemas/Errors'
    CreateSpendingBudgetResponse:
      title: Create Spending Budget Response
      type: object
      required:
      - operation_id
      - data
      properties:
        operation_id:
          title: Operation ID
          type: string
          enum:
          - goals_v1_spending_budgets_post
        data:
          $ref: '#/components/schemas/SpendingBudget'
    BudAmount:
      title: Standard Bud Amount
      type: object
      description: The monetary amount.
      required:
      - value
      - currency
      properties:
        value:
          $ref: '#/components/schemas/BudMonetaryValue'
        currency:
          $ref: '#/components/schemas/BudCurrency'
    BudNextPageTokenMetadata:
      title: Next Page Token
      type: object
      properties:
        next_page_token:
          type: string
          description: 'The token to use to fetch the next page of results. This is only set if there are more results to fetch.

            '
      example:
        next_page_token: 
    BudResultsMetadata:
      title: Metadata
      type: object
      required:
      - results
      properties:
        results:
          type: integer
          description: 'The number of results returned in the response.


            Example: 1

            '
          example: 1
    Error:
      title: Error Object
      type:
      - object
      - 'null'
      description: Contains a field specific error message
      additionalProperties:
        type: string
    UpdateSpendingBudgetResponse:
      title: Update Spending Budget Response
      type: object
      required:
      - operation_id
      - data
      properties:
        operation_id:
          title: Operation ID
          type: string
          enum:
          - goals_v1_spending_budgets_patch
        data:
          $ref: '#/components/schemas/SpendingBudget'
    schemas-Transaction:
      title: Transaction
      type: object
      description: A financial transaction
      required:
      - transaction_id
      - account_id
      - description
      - amount
      - credit_debit_indicator
      - suggested_description
      - status
      - date_time
      properties:
        transaction_id:
          type: string
          description: Unique identifier for the transaction. May be mutable depending on original ingestion source.
        account_id:
          type: string
          description: Identifier for the account associated with the transaction.
        provider:
          type: string
          description: Name of the transaction source provider. Optional as it may not have been supplied when using first party data.
        description:
          type: string
          description: Description of the transaction.
        credit_debit_indicator:
          type: string
          description: Credit/Debit Indicator
          enum:
          - credit
          - debit
        status:
          type: string
          description: Status of the transaction. Defaults to booked.
          enum:
          - booked
          - pending
        amount:
          $ref: '#/components/schemas/BudAmount'
        date_time:
          type: string
          description: Date of the transaction compliant with RFC3339.
        enrichments:
          $ref: '#/components/schemas/schemas-Enrichments'
        suggested_description:
          description: The description Bud suggests client apps show for a given transaction.
          type: string
        suggested_logo:
          description: The logo Bud suggests client apps show for a given transaction.
          type: string
          format: uri
    SpendingBudget:
      allOf:
      - $ref: '#/components/schemas/BaseSpendingBudget'
      - type: object
        required:
        - id
        - name
        - amount
        - recurrency
        - spent
        - created_at
        properties:
          id:
            title: ID
            type: string
            description: 'The ID of the spending budget.


              Example: "81a68821-dca6-4771-80d4-002c7fce412e"

              '
          spent:
            title: Spent
            type: object
            description: 'The amount of money spent from the budget for the given time period.

              '
            required:
            - from
            - to
            - amount
            - ratio
            properties:
              from:
                title: From
                type: string
                description: 'The date from which the budgeting period began in the format [RFC-3339](https://www.ietf.org/rfc/rfc3339.txt).


                  Example: `2023-10-01T00:00:00Z`

                  '
              to:
                title: From
                type: string
                description: 'The date to which the budgeting period ends in the format [RFC-3339](https://www.ietf.org/rfc/rfc3339.txt).


                  Example: `2023-10-31T00:00:00Z`

                  '
              amount:
                title: Amount
                type: object
                description: 'The amount of money spent from the budget.

                  '
                required:
                - value
                - currency
                properties:
                  value:
                    $ref: '#/components/schemas/BudMonetaryValue'
                  currency:
                    $ref: '#/components/schemas/BudCurrency'
              ratio:
                title: Ratio
                type: string
                description: 'The ratio of spent money to the total budget amount.

                  '
          created_at:
            title: Created At
            type: string
            description: 'The date and time the budget was created in the format [RFC-3339](https://www.ietf.org/rfc/rfc3339.txt).


              Example: `2023-10-17T00:00:00Z`

              '
          _links:
            title: _links
            type: object
            description: 'Useful follow up links

              '
            properties:
              transactions:
                title: Transactions Link
                type: string
                description: 'Link to follow to get transactions included in the budget.

                  '
    PatchSpendingBudget:
      title: Patch Spending Budget
      type: object
      properties:
        name:
          title: Name
          type: string
          description: 'The name of the spending budget.


            Example: `Travel`

            '
          example: Travel
        amount:
          title: Amount
          type: object
          description: "The amount of money to be budgeted for. Must be greater than 0. \n\nNote: The Currency of a spending budget cannot be updated.\n"
          required:
          - value
          properties:
            value:
              $ref: '#/components/schemas/BudMonetaryValue'
        recurrency:
          title: Recurrency
          type: object
          description: 'Whether and/or how often the budget recurs.


            The `starting_day` is only required for budgets with a recurring period e.g. `monthly`


            New periods may be added without a breaking change notice.

            '
          required:
          - period
          properties:
            period:
              title: Period
              type: string
              description: 'The period at which a budget recurs (if at all).


                Currently supported options are:

                - `one-off`

                - `monthly`


                New periods may be added without a breaking change notice.

                '
            starting_day:
              title: Starting Day
              type: integer
              description: 'The day of which the budget period starts. Not required if a budget is `one-off`.


                Must be between 1 and 28 for `monthly` budgets.

                '
        include:
          title: Include
          type: object
          description: 'The inclusion criteria for transactions to be included in the budget.

            '
          properties:
            categories:
              title: Categories
              description: "The categories of transactions to be included in the budget. \n\nIf L2 categories are specified, they must be grouped underneath their corresponding L1 category.\n\nAll categories specified must be compatible with the category taxonomy used for that customer.\n"
              type: array
              items:
                required:
                - l1
                properties:
                  l1:
                    title: L1
                    type: string
                    description: 'L1 category to include in the filter. Must be specified if using category filtering.

                      '
                  l2:
                    title: L2
                    type: array
                    description: 'L2 categories to include in the filter. Must all correspond to the parent L1 category specified.

                      '
                    items:
                      type: string
            merchants:
              title: Merchants
              type: object
              description: 'The merchants of transactions to be included in the budget.

                '
              properties:
                slugs:
                  title: Slugs
                  type: array
                  description: 'The slugs of merchants to be included. E.g. `netflix` or `uber`

                    '
                  items:
                    type: string
    BudCurrency:
      title: Currency
      description: 'The three-letter [ISO currency code](https://www.iso.org/iso-4217-currency-codes.html) of the monetary amount.


        Example: `GBP`

        '
      type: string
    Errors:
      title: Array of Error Object
      description: Contains a list of error messages
      type: object
      additionalProperties:
        type: array
        items:
          type: string
    RetrieveSpendingBudgetsResponse:
      title: Retrieve Spending Budgets Response
      type: object
      required:
      - operation_id
      - data
      - metadata
      properties:
        operation_id:
          title: Operation ID
          type: string
          enum:
          - goals_v1_spending_budgets_get
        data:
          type: array
          items:
            $ref: '#/components/schemas/SpendingBudget'
        metadata:
          allOf:
          - $ref: '#/components/schemas/BudResultsMetadata'
          - type: object
            properties:
              account_ids:
                title: Account IDs
                type: array
                description: 'An array of account IDs used for filtering in the request.

                  '
                items:
                  type: string
                  description: 'An account ID used for filtering in the request.


                    Example: `RxsYshVGded4JeilkXgWKdXA`

                    '
    Category:
      title: Category
      type: object
      description: Category associated with a Transaction
      required:
      - slug
      - confidence
      properties:
        slug:
          type: string
          description: Unique human readable identifier of the category. Not subject to version control.
        confidence:
          type: string
          description: Degree of belief of correct assignment, expressed as a probability.
    CreateSpendingBudgetRequest:
      title: Create Spending Budget Request
      allOf:
      - $ref: '#/components/schemas/BaseSpendingBudget'
    BudMonetaryValue:
      title: Monetary Value
      description: "The value of the monetary amount. The value is formatted with the number of decimal places for the respective currency. \n\nExample: `10.98`\n"
      type: string
    schemas-Categories:
      title: Categories
      type: object
      description: "Categories enrichment associated with a Transaction, as generated by Bud's artificial intelligence models. \nCurrently two levels of category are supported, with `l1` being a coarse-grained category level and `l2` being\nmore refined.\n"
      required:
      - l1
      - l2
      properties:
        l1:
          $ref: '#/components/schemas/Category'
          description: Level 1 Category
        l2:
          $ref: '#/components/schemas/Category'
          description: Level 2 Category
    BaseSpendingBudget:
      title: Spending Budget
      type: object
      required:
      - name
      - amount
      - recurrency
      properties:
        name:
          title: Name
          type: string
          description: 'The name of the spending budget.


            Example: `Travel`

            '
          example: Travel
        amount:
          title: Amount
          type: object
          description: 'The amount of money to be budgeted for. Must be greater than 0.

            '
          required:
          - value
          - currency
          properties:
            value:
              $ref: '#/components/schemas/BudMonetaryValue'
            currency:
              $ref: '#/components/schemas/BudCurrency'
        recurrency:
          title: Recurrency
          type: object
          description: 'Whether and/or how often the budget recurs.


            The `starting_day` is only required for budgets with a recurring period e.g. `monthly`


            New periods may be added without a breaking change notice.

            '
          required:
          - period
          properties:
            period:
              title: Period
              type: string
              description: 'The period at which a budget recurs (if at all).


                Currently supported options are:

                - `one-off`

                - `monthly`


                New periods may be added without a breaking change notice.

                '
            starting_day:
              title: Starting Day
              type: integer
              description: 'The day of which the budget period starts. Not required if a budget is `one-off`.


                Must be between 1 and 28 for `monthly` budgets.

                '
        include:
          title: Include
          type: object
          description: 'The inclusion criteria for transactions to be included in the budget.

            '
          properties:
            categories:
              title: Categories
              description: "The categories of transactions to be included in the budget. \n\nIf L2 categories are specified, they must be grouped underneath their corresponding L1 category.\n\nAll categories specified must be compatible with the category taxonomy used for that customer.\n"
              type: array
              items:
                required:
                - l1
                properties:
                  l1:
                    title: L1
                    type: string
                    description: 'L1 category to include in the filter. Must be specified if using category filtering.

                      '
                  l2:
                    title: L2
                    type: array
                    description: 'L2 categories to include in the filter. Must all correspond to the parent L1 category specified.

                      '
                    items:
                      type: string
            merchants:
              title: Merchants
              type: object
              description: 'The merchants of transactions to be included in the budget.

                '
              properties:
                slugs:
                  title: Slugs
                  type: array
                  description: 'The slugs of merchants to be included. E.g. `netflix` or `uber`

                    '
                  items:
                    type: string
    BudPageSizeMetadata:
      title: Page Size
      type: integer
      description: 'The size of the page requested.


        Example: `100`

        '
      example: 100
    ServerErrorResponse:
      title: Server Error Response
      type: object
      required:
      - operation_id
      - code_id
      - message
      properties:
        operation_id:
          $ref: '#/components/schemas/OperationId'
        code_id:
          type: string
          description: A descriptive enough string that is linked to the reason for the error.
        message:
          type: string
          description: An actual user friendly error message.
        errors:
          anyOf:
          - $ref: '#/components/schemas/Error'
          - $ref: '#/components/schemas/Errors'
    RetrieveSpendingBudgetTransactionsResponse:
      title: Retrieve Spending Budget Transactions Response
      type: object
      required:
      - operation_id
      - data
      - metadata
      properties:
        operation_id:
          title: Operation ID
          type: string
          enum:
          - goals_v1_spending_budget_transactions_get
        data:
          type: array
          items:
            $ref: '#/components/schemas/schemas-Transaction'
        metadata:
          allOf:
          - $ref: '#/components/schemas/BudResultsMetadata'
          - type: object
            properties:
              budget_id:
                title: Budget ID
                type: string
                description: 'The ID of the spending budget the transactions were retrieved for.


                  Example: "81a68821-dca6-4771-80d4-002c7fce412e"

                  '
                example: 81a68821-dca6-4771-80d4-002c7fce412e
              page_size:
                $ref: '#/components/schemas/BudPageSizeMetadata'
          - $ref: '#/components/schemas/BudNextPageTokenMetadata'
    schemas-Enrichments:
      title: Enrichments
      type: object
      description: Contextual enrichments associated with a Transaction
      properties:
        categories:
          $ref: '#/components/schemas/schemas-Categories'
        merchant:
          $ref: '#/components/schemas/goals-components_schemas-Merchant'
    OperationId:
      title: Operation Id Field
      type: string
      description: A unique identifier/reference associated with a given endpoint/operation
    goals-components_schemas-Merchant:
