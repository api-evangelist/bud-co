  parameters:
    QueryToBudDate:
      in: query
      name: to
      schema:
        type: string
      example: '2019-02-29T12:23:00Z'
      description: "The date up to when results are to be retrieved in the format [RFC 3339](https://www.rfc-editor.org/rfc/rfc3339).\n\nExamples:\n  - `2023-03-17T17:29:51Z`\n  - `2023-03-17T17:29:51-08:00`\n"
    HeaderSearchTransactionsAccept:
      in: header
      name: Accept
      schema:
        $ref: '#/components/schemas/TransactionsContentType'
      required: false
      description: The requested transaction format (e.g. full transaction model vs only IDs)
    QueryBudPageToken:
      in: query
      name: page_token
      schema:
        type: string
      example: eyJoZWxsbyI6ICJ3b3JsZCJ9Cg==
      description: Use this parameter to fetch a specific page of results. Provided by the next_page_token field in the previous request.
    QueryCategoryL1:
      name: category_l1
      in: query
      schema:
        type: string
        maxLength: 512
      required: false
    CustomerId:
      in: header
      name: X-Customer-Id
      schema:
        type: string
        format: uuid
      required: true
      description: A unique identifier for a Customer, as registered on Bud's platform.
      example: c3339af9-2426-44d4-9c4d-ddb8fd281e23
    QueryCreditDebitIndicator:
      name: credit_debit_indicator
      in: query
      schema:
        type: string
        enum:
        - credit
        - debit
      required: false
    QueryMerchantName:
      name: merchant_name
      in: query
      schema:
        type: string
        maxLength: 512
      required: false
    QueryTag:
      name: tag
      in: query
      schema:
        type: string
        maxLength: 512
      required: false
    QueryAccountId:
      name: account_id
      in: query
      schema:
        type: string
        maxLength: 512
      example: RxsYshVGded4JeilkXgWKdXA
      required: false
      description: 'Account id used to filter results. If multiple account ids are supplied, transactions from all of the supplied accounts will be included in results.

        '
    PathSearchId:
      in: path
      name: search_id
      schema:
        type: string
        format: uuid
      example: 2f6c8ebe-b408-43f8-9152-80e2275deec5
      required: true
    CustomerIdempotentIdentifier:
      in: header
      name: X-Customer-Idempotent-Identifier
      schema:
        type: string
      description: 'Use the internal client identifier, provided in the `client_metadata` object when creating the customer in __Create Customer V3__, in place of an `X-Customer-Id` header.

        '
    QueryBudPageSize:
      in: query
      name: page_size
      schema:
        type: integer
      example: 25
      description: Use this parameter to set the maximum number of results to be returned. This defaults to 25, and has a maximum of 100.
    QueryDescription:
      name: description
      in: query
      schema:
        type: string
        maxLength: 512
      required: false
    QueryCategoryL2:
      name: category_l2
      in: query
      schema:
        type: string
        maxLength: 512
      required: false
    QueryAmountMax:
      name: amount_max
      in: query
      schema:
        type: number
      required: false
      description: 'Include transactions with an amount value less than or equal to the specified value. Must be greater than 0.

        '
    ClientId:
      in: header
      name: X-Client-Id
      schema:
        type: string
      required: true
      description: The API Client Identifier (Service Application Identifier).
      example: 8711bbef-b357-4c2d-97ca-0d9df4206e9a
    QueryAmountMin:
      name: amount_min
      in: query
      schema:
        type: number
        minimum: 0
      required: false
      description: 'Include transactions with an amount value greater than or equal to the specified value

        '
    QueryUserInput:
      name: user_input
      in: query
      schema:
        type: string
        maxLength: 512
      required: false
    QueryFromBudDate:
      in: query
      name: from
      schema:
        type: string
      example: '2019-02-29T12:23:00Z'
      description: "The date from when results are to be retrieved in the format [RFC 3339](https://www.rfc-editor.org/rfc/rfc3339).\n\nExamples:\n  - `2023-01-17T17:29:51Z`\n  - `2023-01-17T17:29:51-08:00`\n"
    HeaderTimezone:
      in: header
      name: X-Timezone
      schema:
        type: string
        format: tz database identifier
      required: true
      description: The [tz database identifier](https://en.wikipedia.org/wiki/List_of_tz_database_time_zones#List) for the user's timezone.
      examples:
        Los Angeles, CA, USA:
          value: US/Pacific
        UK:
          value: Europe/London
  securitySchemes:
    Basic:
      type: http
      scheme: basic
    OAuth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: /v1/oauth/token
          scopes: {}
      description: "\nAuthentication flow:\n\n1. Perform OAuth2 Client Credentials authentication using API Credentials (`client_id`,`client_secret`) to obtain an `access_token` against `/v1/oauth/token` endpoint,\n2. Use `access_token` as Bearer Authorisation for every other API request,\n3. Include `X-Client-Id` (=client_id) within the header of every API request,\n4. Note that some of the requests may also require `X-Customer-Id` to be provided within the request header.\n\n### Examples\nObtain OAuth2 `access_token` and `refresh_token` using `grant_type=client_credentials` and HTTP Basic auth header\n\n```\ncurl --basic --user {{client_id}}:{{client_secret}} \\\n  -X POST https://api-sandbox.thisisbud.com/v1/oauth/token \\\n  -H 'Content-Type: application/x-www-form-urlencoded' \\\n  -d grant_type=client_credentials\n```\n\nSuccessful response:\n```\n{\n  \"operation_id\": \"oauth_token_post\",\n  \"data\": {\n    \"access_token\": \"dd0c17e3fd6d2ce94aa091257a3ea393b4f9b5cf3d3e998f07dc9826da86ff15\",\n    \"token_type\": \"bearer\",\n    \"expires_in\": 3600,\n    \"refresh_token\": \"fac32cca7559d9f6e8f1dfe9a99c71fa1dcfeb482bedf287d7934d2667ae54b3\"\n  }\n}\n```\n\nRefresh `access_token` token using `refresh_token` against `/v1/oauth/token` endpoint with `grant_type=refresh_token`\n\n```\ncurl -X POST \\\n  https://api-sandbox.thisisbud.com/v1/oauth/token \\\n  -H 'Content-Type: application/x-www-form-urlencoded' \\\n  -H 'X-Client-Id: {{client_id}}' \\\n  -d 'grant_type=refresh_token&refresh_token={{refresh_token}}'\n```\n\nSuccessful response:\n```\n{\n    \"operation_id\": \"oauth_token_post\",\n    \"data\": {\n        \"access_token\": \"cc0c17e3fd6d2ce94aa091257a3ea393b4f9b5cf3d3e998f07dc9826da86ff94\",\n        \"token_type\": \"bearer\",\n        \"expires_in\": 3600,\n        \"refresh_token\": \"ffc30cca7559d9f6e8f1dfe9a99c71fa1dcfeb482bedf287d7934d2667ae54b3\"\n    }\n}\n```\n"
