        maxLength: 512
      required: false
    QueryUserInput:
      name: user_input
      in: query
      schema:
        type: string
        maxLength: 512
      required: false
    QueryFromBudDate:
      in: query
      name: from
      schema:
        type: string
      example: '2019-02-29T12:23:00Z'
      description: "The date from when results are to be retrieved in the format [RFC 3339](https://www.rfc-editor.org/rfc/rfc3339).\n\nExamples:\n  - `2023-01-17T17:29:51Z`\n  - `2023-01-17T17:29:51-08:00`\n"
    ClientId:
      in: header
      name: X-Client-Id
      schema:
        type: string
      required: true
      description: The API Client Identifier (Service Application Identifier).
      example: 8711bbef-b357-4c2d-97ca-0d9df4206e9a
    CustomerId:
      in: header
      name: X-Customer-Id
      schema:
        type: string
        format: uuid
      required: true
      description: A unique identifier for a Customer, as registered on Bud's platform.
      example: c3339af9-2426-44d4-9c4d-ddb8fd281e23
    QueryBudPageToken:
      in: query
      name: page_token
      schema:
        type: string
      example: eyJoZWxsbyI6ICJ3b3JsZCJ9Cg==
      description: Use this parameter to fetch a specific page of results. Provided by the next_page_token field in the previous request.
    QueryMerchantName:
      name: merchant_name
      in: query
      schema:
        type: string
        maxLength: 512
      required: false
    HeaderSearchTransactionsAccept:
      in: header
      name: Accept
      schema:
        $ref: '#/components/schemas/TransactionsContentType'
      required: false
      description: The requested transaction format (e.g. full transaction model vs only IDs)
    QueryDescription:
      name: description
      in: query
      schema:
        type: string
        maxLength: 512
      required: false
    HeaderTimezone:
      in: header
      name: X-Timezone
      schema:
        type: string
        format: tz database identifier
      required: true
      description: The [tz database identifier](https://en.wikipedia.org/wiki/List_of_tz_database_time_zones#List) for the user's timezone.
      examples:
