openapi: 3.2.0
info:
  title: 'Bud API Services: Documentation Savings Goals V2 API'
  version: 2.10.10
  description: '# Overview


    ## Introduction

    Welcome to Bud''s API Platform documentation.'
  contact:
    name: Bud Support
    email: help@thisisbud.com
    url: https://www.thisisbud.com/
  x-logo:
    url: data:image/png;base64,
servers:
- url: https://api-sandbox.thisisbud.com
tags:
- name: Savings Goals V2
  x-displayName: Savings Goals V2
  description: Savings goals management API V2.
paths:
  /goals/v2/savings/goal:
    post:
      tags:
      - Savings Goals V2
      summary: Create Savings Goal V2
      description: 'Create a savings goal for the given account.


        The `allocation_ratio` defines the proportion of the account balance that is considered allocated to this goal. For example, an `allocation_ratio` of `0.2` means that 20% of the account balance is treated as the goal balance.


        The `goal_balance` returned in the response is calculated as the current account balance multiplied by the `allocation_ratio`.'
      operationId: goals_v2_savings_goal_post
      security:
      - OAuth2: []
      parameters:
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/CustomerId'
      - $ref: '#/components/parameters/CustomerIdempotentIdentifier'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSavingsGoalV2Request'
            example:
              account_id: RxsYshVGded4JeilkXgWKdXA
              name: Car Savings
              target_amount:
                value: '3000.00'
                currency: GBP
              target_datetime: '2025-12-30T00:00:00Z'
              allocation_ratio: 0.2
      responses:
        '200':
          description: OK - The goal was created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSavingsGoalV2Response'
              example:
                operation_id: goals_v2_savings_goal_post
                data:
                  id: f46d76c4-56d3-11ee-ac69-d6df71eb5902
                  account_id: RxsYshVGded4JeilkXgWKdXA
                  name: Car Savings
                  target_amount:
                    currency: GBP
                    value: '3000.00'
                  target_datetime: '2025-12-30T00:00:00Z'
                  allocation_ratio: 0.2
                  goal_balance:
                    currency: GBP
                    value: '500.00'
                  created_at: '2024-01-15T10:04:43Z'
        '400':
          description: The request contains an invalid payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
              examples:
                Customer ID Missing:
                  value:
                    operation_id: goals_v2_savings_goal_post
                    code_id: failed_validation
                    message: unable to validate request
                    errors:
                      X-Customer-ID: 'parameter "X-Customer-ID" in header has an error: value is required but missing'
                Invalid Allocation Ratio:
                  value:
                    operation_id: goals_v2_savings_goal_post
                    code_id: failed_validation
                    message: Invalid request payload.
                    errors:
                      allocation_ratio:
                      - must be greater than 0 and at most 1
        '401':
          description: Unauthorized - The request was not authorised.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
              example:
                operation_id: unknown
                code_id: unknown
                message: Unauthorised request
        '500':
          description: Internal Server Error - An unexpected error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
              example:
                operation_id: unknown
                code_id: unknown
                message: 'An error occurred while processing your request. Get in touch with us and provide us your request id: 7ef63242-ba6d-4661-8014-f9eaa9cb2ad8'
  /goals/v2/savings/goals:
    get:
      tags:
      - Savings Goals V2
      summary: Retrieve Savings Goals V2
      description: 'Retrieve all savings goals for the customer. The results can be filtered by the `account_id` query parameter.


        The `goal_balance` for each goal is calculated as the current account balance multiplied by the `allocation_ratio`.'
      operationId: goals_v2_savings_goals_get
      security:
      - OAuth2: []
      parameters:
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/CustomerId'
      - $ref: '#/components/parameters/CustomerIdempotentIdentifier'
      - $ref: '#/components/parameters/QueryBudAccountID'
      responses:
        '200':
          description: OK - The goals were retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveSavingsGoalsV2Response'
              examples:
                Goals Returned:
                  value:
                    operation_id: goals_v2_savings_goals_get
                    data:
                    - id: f46d76c4-56d3-11ee-ac69-d6df71eb5902
                      account_id: RxsYshVGded4JeilkXgWKdXA
                      name: Car Savings
                      target_amount:
                        currency: GBP
                        value: '3000.00'
                      target_datetime: '2025-12-30T00:00:00Z'
                      allocation_ratio: 0.2
                      goal_balance:
                        currency: GBP
                        value: '500.00'
                      created_at: '2024-01-15T10:04:43Z'
                    - id: 265a4aed-348d-4ff1-802e-2d08d7cace77
                      account_id: RxsYshVGded4JeilkXgWKdXA
                      name: Holiday Savings
                      target_amount:
                        currency: GBP
                        value: '1000.00'
                      allocation_ratio: 0.1
                      goal_balance:
                        currency: GBP
                        value: '250.00'
                      created_at: '2024-01-15T10:04:43Z'
                No Goals Exist:
                  value:
                    operation_id: goals_v2_savings_goals_get
                    data: []
        '400':
          description: The request contains an invalid payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
              examples:
                Customer ID Missing:
                  value:
                    operation_id: goals_v2_savings_goals_get
                    code_id: failed_validation
                    message: unable to validate request
                    errors:
                      X-Customer-ID: 'parameter "X-Customer-ID" in header has an error: value is required but missing'
        '401':
          description: Unauthorized - The request was not authorised.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
              example:
                operation_id: unknown
                code_id: unknown
                message: Unauthorised request
        '500':
          description: Internal Server Error - An unexpected error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
              example:
                operation_id: unknown
                code_id: unknown
                message: 'An error occurred while processing your request. Get in touch with us and provide us your request id: 7ef63242-ba6d-4661-8014-f9eaa9cb2ad8'
  /goals/v2/savings/goals/{savings_goal_id}:
    get:
      tags:
      - Savings Goals V2
      summary: Retrieve Savings Goal V2
      description: 'Retrieve a savings goal by its `savings_goal_id`.


        The `goal_balance` is calculated as the current account balance multiplied by the `allocation_ratio`.'
      operationId: goals_v2_savings_goal_get
      security:
      - OAuth2: []
      parameters:
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/CustomerId'
      - $ref: '#/components/parameters/CustomerIdempotentIdentifier'
      - $ref: '#/components/parameters/PathSavingsGoalIDV2'
      responses:
        '200':
          description: OK - The goal was retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveSavingsGoalV2Response'
              example:
                operation_id: goals_v2_savings_goal_get
                data:
                  id: f46d76c4-56d3-11ee-ac69-d6df71eb5902
                  account_id: RxsYshVGded4JeilkXgWKdXA
                  name: Car Savings
                  target_amount:
                    currency: GBP
                    value: '3000.00'
                  target_datetime: '2025-12-30T00:00:00Z'
                  allocation_ratio: 0.2
                  goal_balance:
                    currency: GBP
                    value: '500.00'
                  created_at: '2024-01-15T10:04:43Z'
        '400':
          description: The request contains an invalid payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
              examples:
                Customer ID Missing:
                  value:
                    operation_id: goals_v2_savings_goal_get
                    code_id: failed_validation
                    message: unable to validate request
                    errors:
                      X-Customer-ID: 'parameter "X-Customer-ID" in header has an error: value is required but missing'
                Invalid Goal ID:
                  value:
                    operation_id: goals_v2_savings_goal_get
                    code_id: failed_validation
                    message: Invalid request payload.
                    errors:
                      savings_goal_id:
                      - invalid UUID format
        '401':
          description: Unauthorized - The request was not authorised.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
              example:
                operation_id: unknown
                code_id: unknown
                message: Unauthorised request
        '404':
          description: Not Found - The savings goal ID could not be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
              example:
                operation_id: unknown
                code_id: unknown
                message: Route or resource not found
                errors: {}
        '500':
          description: Internal Server Error - An unexpected error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
              example:
                operation_id: unknown
                code_id: unknown
                message: 'An error occurred while processing your request. Get in touch with us and provide us your request id: 7ef63242-ba6d-4661-8014-f9eaa9cb2ad8'
    patch:
      tags:
      - Savings Goals V2
      summary: Update Savings Goal V2
      description: 'Update a savings goal with the given `savings_goal_id`. All fields are optional.


        The `goal_balance` returned in the response is recalculated as the current account balance multiplied by the updated `allocation_ratio`.'
      operationId: goals_v2_savings_goal_patch
      security:
      - OAuth2: []
      parameters:
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/CustomerId'
      - $ref: '#/components/parameters/CustomerIdempotentIdentifier'
      - $ref: '#/components/parameters/PathSavingsGoalIDV2'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSavingsGoalV2Request'
            examples:
              Name Updated:
                value:
                  name: Mortgage Deposit Savings
              Allocation Ratio and Target Date Updated:
                value:
                  allocation_ratio: 0.25
                  target_datetime: '2026-06-30T00:00:00Z'
      responses:
        '200':
          description: OK - The goal was updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateSavingsGoalV2Response'
              example:
                operation_id: goals_v2_savings_goal_patch
                data:
                  id: f46d76c4-56d3-11ee-ac69-d6df71eb5902
                  account_id: RxsYshVGded4JeilkXgWKdXA
                  name: Mortgage Deposit Savings
                  target_amount:
                    currency: GBP
                    value: '3000.00'
                  target_datetime: '2026-06-30T00:00:00Z'
                  allocation_ratio: 0.25
                  goal_balance:
                    currency: GBP
                    value: '625.00'
                  created_at: '2024-01-15T10:04:43Z'
        '400':
          description: The request contains an invalid payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
              examples:
                Customer ID Missing:
                  value:
                    operation_id: goals_v2_savings_goal_patch
                    code_id: failed_validation
                    message: unable to validate request
                    errors:
                      X-Customer-ID: 'parameter "X-Customer-ID" in header has an error: value is required but missing'
                Invalid Allocation Ratio:
                  value:
                    operation_id: goals_v2_savings_goal_patch
                    code_id: failed_validation
                    message: Invalid request payload.
                    errors:
                      allocation_ratio:
                      - must be greater than 0 and at most 1
        '401':
          description: Unauthorized - The request was not authorised.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
              example:
                operation_id: unknown
                code_id: unknown
                message: Unauthorised request
        '404':
          description: Not Found - The savings goal ID could not be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
              example:
                operation_id: unknown
                code_id: unknown
                message: Route or resource not found
                errors: {}
        '500':
          description: Internal Server Error - An unexpected error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
              example:
                operation_id: unknown
                code_id: unknown
                message: 'An error occurred while processing your request. Get in touch with us and provide us your request id: 7ef63242-ba6d-4661-8014-f9eaa9cb2ad8'
    delete:
      tags:
      - Savings Goals V2
      summary: Remove Savings Goal V2
      description: Remove a savings goal with the given `savings_goal_id`.
      operationId: goals_v2_savings_goal_delete
      security:
      - OAuth2: []
      parameters:
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/CustomerId'
      - $ref: '#/components/parameters/CustomerIdempotentIdentifier'
      - $ref: '#/components/parameters/PathSavingsGoalIDV2'
      responses:
        '204':
          description: No Content - The goal was removed successfully.
        '400':
          description: The request contains an invalid payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
              examples:
                Invalid Goal ID:
                  value:
                    operation_id: goals_v2_savings_goal_delete
                    code_id: failed_validation
                    message: Invalid request payload.
                    errors:
                      savings_goal_id:
                      - invalid UUID format
        '401':
          description: Unauthorized - The request was not authorised.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
              example:
                operation_id: unknown
                code_id: unknown
                message: Unauthorised request
        '404':
          description: Not Found - The savings goal ID could not be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
              example:
                operation_id: unknown
                code_id: unknown
                message: Route or resource not found
                errors: {}
        '500':
          description: Internal Server Error - An unexpected error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
              example:
                operation_id: unknown
                code_id: unknown
                message: 'An error occurred while processing your request. Get in touch with us and provide us your request id: 7ef63242-ba6d-4661-8014-f9eaa9cb2ad8'
components:
  schemas:
    Error:
      title: Error Object
      type:
      - object
      - 'null'
      description: Contains a field specific error message
      additionalProperties:
        type: string
    BudCurrency:
      title: Currency
      description: 'The three-letter [ISO currency code](https://www.iso.org/iso-4217-currency-codes.html) of the monetary amount.


        Example: `GBP`

        '
      type: string
    BudMonetaryValue:
      title: Monetary Value
      description: "The value of the monetary amount. The value is formatted with the number of decimal places for the respective currency. \n\nExample: `10.98`\n"
      type: string
    BadRequestResponse:
      title: Bad Request Response
      type: object
      description: Expected response structure
      required:
      - operation_id
      - code_id
      - message
      - errors
      properties:
        operation_id:
          $ref: '#/components/schemas/OperationId'
        code_id:
          type: string
          description: A descriptive enough string that is linked to the reason for the error.
        message:
          type: string
        errors:
          anyOf:
          - $ref: '#/components/schemas/Error'
          - $ref: '#/components/schemas/Errors'
    CreateSavingsGoalV2Response:
      title: Create Savings Goal V2 Response
      required:
      - operation_id
      - data
      properties:
        operation_id:
          title: Operation ID
          type: string
          enum:
          - goals_v2_savings_goal_post
        data:
          $ref: '#/components/schemas/SavingsGoalV2'
    SavingsGoalV2:
      title: Savings Goal V2
      required:
      - id
      - account_id
      - name
      - target_amount
      - allocation_ratio
      - goal_balance
      - created_at
      properties:
        id:
          title: ID
          type: string
          format: uuid
          description: 'The ID of the savings goal.


            Example: `81a68821-dca6-4771-80d4-002c7fce412e`

            '
          example: 81a68821-dca6-4771-80d4-002c7fce412e
        account_id:
          title: Account ID
          type: string
          description: 'The account ID the savings goal is associated with.


            Example: `RxsYshVGded4JeilkXgWKdXA`

            '
          example: RxsYshVGded4JeilkXgWKdXA
        name:
          title: Name
          type: string
          description: 'The name of the savings goal.


            Example: `Holiday`

            '
          example: Holiday
        target_amount:
          title: Target Amount
          type: object
          description: 'The target amount of money to be saved for this goal.

            '
          required:
          - value
          - currency
          properties:
            value:
              $ref: '#/components/schemas/BudMonetaryValue'
            currency:
              $ref: '#/components/schemas/BudCurrency'
        target_datetime:
          title: Target Datetime
          type: string
          description: "The optional target date by which the savings goal should be reached, in the format [RFC-3339](https://www.rfc-editor.org/rfc/rfc3339).\n\nExamples:\n  - `2025-12-31T00:00:00Z`\n  - `2025-12-31T00:00:00+01:00`\n"
        allocation_ratio:
          title: Allocation Ratio
          type: number
          format: float
          description: 'The proportion of the account balance allocated to this savings goal. Must be greater than `0` and at most `1`.


            For example, a value of `0.2` means 20% of the account balance is considered allocated to this goal.


            Example: `0.2`

            '
          example: 0.2
        goal_balance:
          title: Goal Balance
          type: object
          description: 'The current balance allocated to this savings goal, calculated as the account balance multiplied by the `allocation_ratio`.

            '
          required:
          - value
          - currency
          properties:
            value:
              $ref: '#/components/schemas/BudMonetaryValue'
            currency:
              $ref: '#/components/schemas/BudCurrency'
        created_at:
          title: Created At
          type: string
          description: "The date and time the savings goal was created in the format [RFC-3339](https://www.rfc-editor.org/rfc/rfc3339).\n\nExamples:\n  - `2023-01-17T17:29:51Z`\n  - `2023-01-17T17:29:51-08:00`\n"
    RetrieveSavingsGoalV2Response:
      title: Retrieve Savings Goal V2 Response
      required:
      - operation_id
      - data
      properties:
        operation_id:
          title: Operation ID
          type: string
          enum:
          - goals_v2_savings_goal_get
        data:
          $ref: '#/components/schemas/SavingsGoalV2'
    UpdateSavingsGoalV2Response:
      title: Update Savings Goal V2 Response
      required:
      - operation_id
      - data
      properties:
        operation_id:
          title: Operation ID
          type: string
          enum:
          - goals_v2_savings_goal_patch
        data:
          $ref: '#/components/schemas/SavingsGoalV2'
    RetrieveSavingsGoalsV2Response:
      title: Retrieve Savings Goals V2 Response
      required:
      - operation_id
      - data
      properties:
        operation_id:
          title: Operation ID
          type: string
          enum:
          - goals_v2_savings_goals_get
        data:
          type: array
          items:
            $ref: '#/components/schemas/SavingsGoalV2'
    ServerErrorResponse:
      title: Server Error Response
      type: object
      required:
      - operation_id
      - code_id
      - message
      properties:
        operation_id:
          $ref: '#/components/schemas/OperationId'
        code_id:
          type: string
          description: A descriptive enough string that is linked to the reason for the error.
        message:
          type: string
          description: An actual user friendly error message.
        errors:
          anyOf:
          - $ref: '#/components/schemas/Error'
          - $ref: '#/components/schemas/Errors'
    Errors:
      title: Array of Error Object
      description: Contains a list of error messages
      type: object
      additionalProperties:
        type: array
        items:
          type: string
    CreateSavingsGoalV2Request:
      title: Create Savings Goal V2 Request
      required:
      - account_id
      - name
      - target_amount
      - allocation_ratio
      properties:
        account_id:
          title: Account ID
          type: string
          description: 'The account ID the savings goal is associated with.


            Example: `RxsYshVGded4JeilkXgWKdXA`

            '
          example: RxsYshVGded4JeilkXgWKdXA
        name:
          title: Name
          type: string
          description: 'The name of the savings goal.


            Example: `Holiday`

            '
          example: Holiday
        target_amount:
          title: Target Amount
          type: object
          description: 'The target amount of money to be saved for this goal.

            '
          required:
          - value
          - currency
          properties:
            value:
              $ref: '#/components/schemas/BudMonetaryValue'
            currency:
              $ref: '#/components/schemas/BudCurrency'
        target_datetime:
          title: Target Datetime
          type: string
          description: "The optional target date by which the savings goal should be reached, in the format [RFC-3339](https://www.rfc-editor.org/rfc/rfc3339). Must be a future date.\n\nExamples:\n  - `2025-12-31T00:00:00Z`\n  - `2025-12-31T00:00:00+01:00`\n"
        allocation_ratio:
          title: Allocation Ratio
          type: number
          format: float
          description: 'The proportion of the account balance to allocate to this savings goal. Must be greater than `0` and at most `1`.


            Example: `0.2`

            '
          example: 0.2
    UpdateSavingsGoalV2Request:
      title: Update Savings Goal V2 Request
      properties:
        account_id:
          title: Account ID
          type: string
          description: 'The account ID the savings goal is associated with.


            Example: `RxsYshVGded4JeilkXgWKdXA`

            '
          example: RxsYshVGded4JeilkXgWKdXA
        name:
          title: Name
          type: string
          description: 'The name of the savings goal.


            Example: `Holiday`

            '
          example: Holiday
        target_amount:
          title: Target Amount
          type: object
          description: 'The target amount of money to be saved for this goal.

            '
          required:
          - value
          - currency
          properties:
            value:
              $ref: '#/components/schemas/BudMonetaryValue'
            currency:
              $ref: '#/components/schemas/BudCurrency'
        target_datetime:
          title: Target Datetime
          type:
          - string
          - 'null'
          description: "The target date by which the savings goal should be reached, in the format [RFC-3339](https://www.rfc-editor.org/rfc/rfc3339). Must be a future date. Set to `null` to remove the target date.\n\nExamples:\n  - `2025-12-31T00:00:00Z`\n  - `2025-12-31T00:00:00+01:00`\n"
        allocation_ratio:
          title: Allocation Ratio
          type: number
          format: float
          description: 'The proportion of the account balance to allocate to this savings goal. Must be greater than `0` and at most `1`.


            Example: `0.25`

            '
          example: 0.25
    OperationId:
      title: Operation Id Field
      type: string
      description: A unique identifier/reference associated with a given endpoint/operation
  parameters:
    QueryBudAccountID:
      in: query
      name: account_id
      schema:
        type: string
      example: RxsYshVGded4JeilkXgWKdXA
      description: 'Use this parameter to filter the results on data associated with the given account id.


        Example: `RxsYshVGded4JeilkXgWKdXA`

        '
    CustomerIdempotentIdentifier:
      in: header
      name: X-Customer-Idempotent-Identifier
      schema:
        type: string
      description: 'Use the internal client identifier, provided in the `client_metadata` object when creating the customer in __Create Customer V3__, in place of an `X-Customer-Id` header.

        '
    CustomerId:
      in: header
      name: X-Customer-Id
      schema:
        type: string
        format: uuid
      required: true
      description: A unique identifier for a Customer, as registered on Bud's platform.
      example: c3339af9-2426-44d4-9c4d-ddb8fd281e23
