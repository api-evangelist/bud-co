openapi: 3.2.0
info:
  title: 'Bud API Services: Documentation Retrieve Affordability…'
  version: 2.10.10
  description: '# Overview


    ## Introduction

    Welcome to Bud''s API Platform documentation.'
  contact:
    name: Bud Support
    email: help@thisisbud.com
    url: https://www.thisisbud.com/
  x-logo:
    url: data:image/png;base64,
servers:
- url: https://api-sandbox.thisisbud.com
tags:
- name: Retrieve Affordability Report V2
  x-displayName: Retrieve Affordability Report V2
  description: 'Breakdown your customer''s transactions by fixed/flexible spend and discretionary vs non discretionary high-level totals.

    Retrieve Affordability Report V2 endpoints are designed to closely reflect the assess dashboard aggregations/definitions.'
paths:
