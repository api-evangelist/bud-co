    IncomeExpenditureAnalysis:
      type: object
      description: "Object presents a single expenditure group income analysis report. The focus of this object is to present a \nview of a single expenditure and its impact on a customers income. The report is broken down into financial months\nto help identify spikes in income consumed by the expenditure group.\n\nThe type of report is identified by the `type` field. There are several types of analyses:\n  - income-cash-withdrawal: Identifies the total amount of cash withdrawn from a customers account.\n  - income-debt: Identifies debt payments in the customer's expenses.\n  - income-gambling: Identifies gambling related transactions in the customer's report.\n  - income-loan: Identifies loan related transactions.\n  - income-essential-expenditure: Identifies essential expenditure and compares it against income for the time period\n  - income-all-expenditure: Total debits vs income for a specified time period\n"
      required:
      - type
      - currency
      - expenditure
      - income
      - _links
      properties:
        type:
          type: string
          enum:
          - income-cash-withdrawal
          - income-loan
          - income-gambling
          - income-debt
          - income-essential-expenditure
          - income-all-expenditure
          description: 'A unique human readable string used to identify a expenditure group income analysis report.


            Note, these are subject to change and should not be used to identify a report. These are not unique within

            a result list and are used to identify the type of report.

            '
        currency:
          $ref: '#/components/schemas/BudCurrency'
        income:
          type: object
          required:
          - credit_debit_indicator
          - count
          - total
          - monthly_average
          - transactions_reference
          - _links
          properties:
            credit_debit_indicator:
              $ref: '#/components/schemas/CreditDebitIndicator'
            count:
              type: integer
              description: 'The number of transactions related to this insight.

                '
            total:
              $ref: '#/components/schemas/BudAmount'
              description: 'The total amount of income for the period of the report for a predefined currency.

                '
            monthly_average:
              $ref: '#/components/schemas/BudAmount'
              description: 'The average amount of income for the period of the report for a predefined currency.

                '
            breakdown:
              type: array
              items:
                type: object
                description: "A breakdown of the specific transactional group for the period of the report. \nThe breakdown of data is defined by the granularity of the report, defaulting to monthly. \nThe `to`/`from` properties within the object refer to the datetime boundaries of subsection.\n"
                required:
                - from
                - to
                - total
                - count
                - transactions_reference
                - _links
                properties:
                  from:
                    $ref: '#/components/schemas/schemas-DateTimeISO8601'
                  to:
                    $ref: '#/components/schemas/schemas-DateTimeISO8601'
                  total:
                    $ref: '#/components/schemas/BudAmount'
                    description: 'The total amount of expenditure for the period of the report for a predefined currency.

                      '
                  count:
                    type: integer
                    description: 'The number of transactions related to this insight.

                      '
                  transactions_reference:
                    $ref: '#/components/schemas/TransactionsReference'
                  _links:
                    $ref: '#/components/schemas/schemas-TransactionsLinks'
            transactions_reference:
              $ref: '#/components/schemas/TransactionsReference'
            _links:
              $ref: '#/components/schemas/schemas-TransactionsLinks'
        expenditure:
          type: object
          required:
          - credit_debit_indicator
          - count
          - total
          - monthly_average
          - relative_to_income
          - transactions_reference
          - _links
          properties:
            credit_debit_indicator:
              $ref: '#/components/schemas/CreditDebitIndicator'
            count:
              type: integer
              description: 'The number of transactions related to this insight.

                '
            total:
              $ref: '#/components/schemas/BudAmount'
              description: 'The total amount of expenditure for the period of the report for a predefined currency.

                '
            monthly_average:
              $ref: '#/components/schemas/BudAmount'
              description: 'The average amount of income for the period of the report for a predefined currency.

                '
            relative_to_income:
              type: string
              description: 'A percentage value to represent the scale another value is in relation to a customers income.

                '
            transactions_reference:
              $ref: '#/components/schemas/TransactionsReference'
            _links:
              $ref: '#/components/schemas/schemas-TransactionsLinks'
        transactions_reference:
          $ref: '#/components/schemas/TransactionsReference'
        _links:
          $ref: '#/components/schemas/schemas-TransactionsLinks'
