  /v1/affordability/transactions:
    get:
      tags:
      - Retrieve Affordability Report
      summary: Retrieve Affordability Transactions
      description: 'View the transactions that were used to calculate a customer''s Retrieve Affordability Report.

        > ❗️ Deprecation:

        >

        > Support will cease for this endpoint on the 31st of Jan 2025 - please complete your migration to the Retrieve Affordability Transactions V2 endpoint by that point in time. For further details, contact your Bud account manager or email help@thisisbud.com.'
      operationId: v1_affordability_transactions_get
      deprecated: true
      security:
      - OAuth2: []
      parameters:
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/CustomerId'
      - $ref: '#/components/parameters/CustomerIdempotentIdentifier'
      - $ref: '#/components/parameters/CustomerSecret'
      - $ref: '#/components/parameters/DateFrom'
      - $ref: '#/components/parameters/DateTo'
      - $ref: '#/components/parameters/Criteria'
      responses:
        '200':
          description: The request was successfully processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpendingGroupsTransactionsResponse'
              example:
                operation_id: v1_affordability_transactions_get
                data:
                - transaction_id: fdcc55c6-f347-4abc-8c66-61ff290d8bd4
                  account_id: fdcc55c6-f347-4abc-8c66-61ff290d8bd4
                  description: Bud
                  date: '2012-05-30'
                  indicator: Credit
                  amount:
                    amount: '1500.00'
                    currency: GBP
                  categories:
                    l1: finances
                    l2: income
                  criteria_satisfied:
                  - net_disposable_income
        '400':
          description: The request contains an invalid payload.
        '401':
          description: Unauthorised request
        '405':
          description: An unexpected HTTP method was used
        5XX:
          description: An unexpected error occurred on the server side
components:
  schemas:
    TransactionsLinks:
      title: Affordability Transaction Links
      type: object
      description: Transaction Links
      required:
      - transactions
      properties:
        transactions:
          type: string
    MonthlyRangePrediction:
      title: Monthly Range Prediction
      type: object
      description: Monthly Range
      required:
      - predicted_monthly_range
      - _links
      properties:
        overall_total:
          allOf:
          - $ref: '#/components/schemas/BudAmount'
          - description: 'Overall total over the report period.

              '
        monthly_totals:
          type: array
          items:
            $ref: '#/components/schemas/MonthlyTotal'
          description: 'Total per month over the report period.

            '
        predicted_monthly_range:
          required:
          - low
          - high
          - average
          properties:
            low:
              $ref: '#/components/schemas/BudAmount'
            high:
              $ref: '#/components/schemas/BudAmount'
            average:
              $ref: '#/components/schemas/BudAmount'
        _links:
          $ref: '#/components/schemas/TransactionsLinks'
    schemas-DateTimeISO8601:
      title: Date/Time (ISO 8601)
      type: string
      description: ISO Date Format
      example: '2022-03-05T13:34:33Z'
    CriteriaInternalTransfers:
      type: string
      description: 'Internal transfers criteria returns all credit/debit transactions deemed to be made between an individual financial pool. If we drill down to the account level, wealth has been gained/lost however if we drill up we see no change in net sum.

        '
      enum:
      - internal_transfers
    CriteriaFlexibleExpenditure:
      type: string
      description: 'Flexible expenditure criteria will include all transactions which fall under the categories defined/expected to be inconsistent. inconsistent in the sense of both time and financial commitment, i.e. transactions falling under food_and_drink/eating_out_and_takeaways

        '
      enum:
      - flexible_expenditure
    CriteriaNetDisposableIncome:
      type: string
      description: 'Net Disposable Income criteria will return all transactions falling within the income category grouping. Typically includes exclusively credit transactions.

        '
      enum:
      - net_disposable_income
    BudCurrency:
      title: Currency
      description: 'The three-letter [ISO currency code](https://www.iso.org/iso-4217-currency-codes.html) of the monetary amount.


        Example: `GBP`

        '
      type: string
    TimezoneIdentifier:
      type: string
      description: 'Timezone identifier (e.g. `Europe/London`) to make dates relativised to the target location.


        In the case of daylight savings in a location, this ensures that the overall start/end date accounts for those shifts.


        See [here](https://en.wikipedia.org/wiki/List_of_tz_database_time_zones) for list of valid timezone identifiers under `TZ identifier`.'
      default: Etc/UTC
    BudMonetaryValue:
      title: Monetary Value
      description: "The value of the monetary amount. The value is formatted with the number of decimal places for the respective currency. \n\nExample: `10.98`\n"
      type: string
    CriteriaFixedExpenditure:
      type: string
      description: 'Fixed expenditure criteria will include all transactions which fall under the categories defined/expected to be consistent. Consistent in the sense of both time and financial commitment, i.e. a subscription to a healthcare provider.

        '
      enum:
      - fixed_expenditure
    SpendingGroupsTransactionsResponse:
      title: Spending Groups Transactions Response
      type: object
      description: Expected response structure
      required:
      - operation_id
      - data
      properties:
        operation_id:
          type: string
          enum:
          - v1_affordability_transactions_get
        data:
          type: array
          items:
            $ref: '#/components/schemas/SpendingGroupTransaction'
    LegacyBudAmount:
      title: Legacy Bud Amount
      type: object
      description: The monetary amount.
      required:
      - amount
      - currency
      properties:
        amount:
          $ref: '#/components/schemas/BudMonetaryValue'
        currency:
          $ref: '#/components/schemas/BudCurrency'
    MonthlyIncomeExpenditurePrediction:
      title: Monthly Income & Expenditure Predictions
      type: object
      description: Monthly Income & Expenditure Predictions
      required:
      - predicted_monthly
      - _links
      properties:
        overall_total:
          allOf:
          - $ref: '#/components/schemas/BudAmount'
          - description: 'Overall total over the report period.

              '
        monthly_totals:
          type: array
          items:
            $ref: '#/components/schemas/MonthlyTotal'
          description: 'Total per month over the report period.

            '
        predicted_monthly:
          $ref: '#/components/schemas/BudAmount'
        _links:
          $ref: '#/components/schemas/IncomeAndExpenditureTransactionsLinks'
    MonthlyTotal:
      required:
      - month
      - amount
      properties:
        month:
          type: string
          description: 'Month (format `YYYY-MM`)

            '
        amount:
          $ref: '#/components/schemas/BudAmount'
    ReportTotal:
      required:
      - predicted_monthly
      - _links
      properties:
        overall_total:
          allOf:
          - $ref: '#/components/schemas/BudAmount'
          - description: 'Overall total over the report period.

              '
        monthly_totals:
          type: array
          items:
            $ref: '#/components/schemas/MonthlyTotal'
          description: 'Total per month over the report period.

            '
        predicted_monthly:
          $ref: '#/components/schemas/BudAmount'
        _links:
          $ref: '#/components/schemas/TransactionsLinks'
    CriteriaEssentialExpenditure:
      type: string
      description: 'Essential expenditure criteria will include all transactions which fall under categories deemed to be essential to a persons day to day life. These expenditure can be seen as "needs" rather than "wants". For example, food_and_drink/groceries expenditure are essential compared to shopping/hobbies.

        '
      enum:
      - essential_expenditure
    SpendingGroupTransaction:
      title: Spending Groups Transaction Response Data
      type: object
      description: Expected response structure
      required:
      - transaction_id
      - account_id
      - amount
      - indicator
      - categories
      properties:
        transaction_id:
          description: Unique identifier for the transaction within an servicing institution. This identifier is both unique and immutable.
          type: string
        account_id:
          description: A unique and immutable identifier used to identify the account resource. This identifier has no meaning to the account owner
          type: string
        description:
          description: Further details of the transaction.
          type: string
        date:
          description: Date and time when a transaction entry is posted to an account on the account servicer's books. ISODateTime.
          type: string
          format: date
        indicator:
          type: string
          enum:
          - Credit
          - Debit
        amount:
          $ref: '#/components/schemas/LegacyBudAmount'
        categories:
          $ref: '#/components/schemas/SpendingGroupCategories'
        criteria_satisfied:
          type: array
          items:
            $ref: '#/components/schemas/AffordabilityCriteria'
    SpendingGroupCategories:
      title: Spending Group Categories
      type: object
      description: Spending Group Categories
      required:
      - l1
      - l2
      properties:
        l1:
          description: The name of the category returned by the model.
          type: string
        l2:
          description: The name of the sub category returned by the model.
          type: string
    AffordabilityReport:
      title: Retrieve Affordability Report Response
      type: object
      description: Retrieve Affordability Report Response Data
      required:
      - months_assessed
      - accounts
      - assessment
      properties:
        months_assessed:
          description: Details the start and end dates for which the affordability calculation has been run
          required:
          - start
          - end
          properties:
            start:
              description: Date (YYYY-MM) from which the calculation should be returned from
              type: string
            end:
              description: Date (YYYY-MM) from which the calculation should be returned to
              type: string
        accounts:
          description: Information surrounding a given Customer's Open Banking Account(s)
          required:
          - connected
          - holder_names
          - missing_data
          properties:
            connected:
              description: Number of accounts connected.
              type: integer
            holder_names:
              description: Account holder names associated to connected accounts.
              type: array
              items:
                type: string
            missing_data:
              description: Data from the customer that is deemed (in)sufficient for making assessments.
              required:
              - income
              - expenditure
              properties:
                income:
                  description: Specifies if there is enough data to determine customer's income.
                  type: boolean
                expenditure:
                  description: Specifies if there is enough data to determine customer's expenditure.
                  type: boolean
        assessment:
          description: A breakdown of a customers income and expenditure.
          required:
          - income
          - expenditure
          properties:
            income:
              description: Detailing transactions linked to a customers income
              required:
              - net_disposable
              - net_discretionary
              properties:
                net_disposable:
                  allOf:
                  - description: Income -- excluding benefits -- after taxes
                  - $ref: '#/components/schemas/ReportTotal'
                net_discretionary:
                  allOf:
                  - description: Net disposable income subtract essential expenditure
                  - $ref: '#/components/schemas/MonthlyIncomeExpenditurePrediction'
            expenditure:
              description: Detailing transactions linked to a customers expenditure
              required:
              - fixed
              - flexible
              - essential
              - non_essential
              properties:
                fixed:
                  description: An expense that is a fixed amount each month
                  allOf:
                  - $ref: '#/components/schemas/ReportTotal'
                flexible:
                  description: A regular expense that differs in amount each month
                  allOf:
                  - $ref: '#/components/schemas/MonthlyRangePrediction'
                essential:
                  description: An expense that is not optional for a customer to pay, but isn’t necessarily the same in £ amount each month.
                  allOf:
                  - $ref: '#/components/schemas/ReportTotal'
                non_essential:
                  description: An expense that a customer does not necessarily need to make per month, and isn’t necessarily the same in £ amount each month.
                  allOf:
                  - $ref: '#/components/schemas/ReportTotal'
    IncomeAndExpenditureTransactionsLinks:
      title: Income & Expenditure Transactions Links
      type: object
      description: Income & Expenditure Transactions Links
      required:
      - income_transactions
      - expenditure_transactions
      properties:
        income_transactions:
          type: string
        expenditure_transactions:
          type: string
    BudAmount:
      title: Standard Bud Amount
      type: object
      description: The monetary amount.
      required:
      - value
      - currency
      properties:
        value:
          $ref: '#/components/schemas/BudMonetaryValue'
        currency:
          $ref: '#/components/schemas/BudCurrency'
    AffordabilityReportResponse:
      title: Retrieve Affordability Report Schema
      type: object
      description: Expected response structure
      required:
      - operation_id
      - data
      properties:
        operation_id:
          type: string
          enum:
          - v1_affordability_report
        data:
          $ref: '#/components/schemas/AffordabilityReport'
    AffordabilityCriteria:
      oneOf:
      - $ref: '#/components/schemas/CriteriaNetDisposableIncome'
      - $ref: '#/components/schemas/CriteriaFixedExpenditure'
      - $ref: '#/components/schemas/CriteriaFlexibleExpenditure'
      - $ref: '#/components/schemas/CriteriaEssentialExpenditure'
      - $ref: '#/components/schemas/CriteriaNonessentialExpenditure'
      - $ref: '#/components/schemas/CriteriaInternalTransfers'
    CriteriaNonessentialExpenditure:
      type: string
      description: 'Non essential expenditure criteria will include all transactions which fall under categories deemed to be non essential to a persons day to day life. These expenditure can be seen as "wants" rather than "needs". For example, shopping/hobbies expenditure are essential compared to food_and_drink/groceries.

        '
      enum:
      - non_essential_expenditure
  parameters:
    URLMonthFrom:
      in: query
      name: month_from
      required: false
      schema:
        type: string
        example: 2019-02
        description: Month (`YYYY-MM`) from which the transactions should be returned from, this works in pair with the `month_to` parameter.
    DateTo:
      in: query
      name: date_to
      schema:
        $ref: '#/components/schemas/schemas-DateTimeISO8601'
    DateFrom:
      in: query
      name: date_from
      schema:
        $ref: '#/components/schemas/schemas-DateTimeISO8601'
    Timezone:
      in: query
      name: timezone
      schema:
        $ref: '#/components/schemas/TimezoneIdentifier'
    OverallTotals:
      in: query
      name: overall_totals
      schema:
        type: boolean
        description: 'If `true`, shows the overall totals in the affordability report (under `overall_total` property).

          '
    CustomerIdempotentIdentifier:
      in: header
      name: X-Customer-Idempotent-Identifier
      schema:
        type: string
      description: 'Use the internal client identifier, provided in the `client_metadata` object when creating the customer in __Create Customer V3__, in place of an `X-Customer-Id` header.

        '
    CustomerId:
      in: header
      name: X-Customer-Id
      schema:
        type: string
        format: uuid
      required: true
      description: A unique identifier for a Customer, as registered on Bud's platform.
      example: c3339af9-2426-44d4-9c4d-ddb8fd281e23
    ClientId:
      in: header
      name: X-Client-Id
      schema:
        type: string
      required: true
      description: The API Client Identifier (Service Application Identifier).
      example: 8711bbef-b357-4c2d-97ca-0d9df4206e9a
    Criteria:
      in: query
      name: criteria
      style: form
      explode: false
      schema:
        type: array
        items:
          $ref: '#/components/schemas/AffordabilityCriteria'
    URLMonthTo:
      in: query
      name: month_to
      required: false
      schema:
        type: string
        example: 2019-03
        description: Month (`YYYY-MM`) from which the transactions should be returned to, this works in pair with the `month_from` parameter.
    CustomerSecret:
      in: header
      name: X-Customer-Secret
      schema:
        type: string
      required: false
      description: The Bud Customer secret used to encrypt customer data. This is required only if the customer secret is not already stored with Bud.
    MonthlyTotals:
      in: query
      name: monthly_totals
      schema:
        type: boolean
        description: 'If `true`, shows the monthly totals in the affordability report (under `monthly_totals` property).

          '
  securitySchemes:
    Basic:
      type: http
      scheme: basic
    OAuth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: /v1/oauth/token
          scopes: {}
      description: "\nAuthentication flow:\n\n1. Perform OAuth2 Client Credentials authentication using API Credentials (`client_id`,`client_secret`) to obtain an `access_token` against `/v1/oauth/token` endpoint,\n2. Use `access_token` as Bearer Authorisation for every other API request,\n3. Include `X-Client-Id` (=client_id) within the header of every API request,\n4. Note that some of the requests may also require `X-Customer-Id` to be provided within the request header.\n\n### Examples\nObtain OAuth2 `access_token` and `refresh_token` using `grant_type=client_credentials` and HTTP Basic auth header\n\n```\ncurl --basic --user {{client_id}}:{{client_secret}} \\\n  -X POST https://api-sandbox.thisisbud.com/v1/oauth/token \\\n  -H 'Content-Type: application/x-www-form-urlencoded' \\\n  -d grant_type=client_credentials\n```\n\nSuccessful response:\n```\n{\n  \"operation_id\": \"oauth_token_post\",\n  \"data\": {\n    \"access_token\": \"dd0c17e3fd6d2ce94aa091257a3ea393b4f9b5cf3d3e998f07dc9826da86ff15\",\n    \"token_type\": \"bearer\",\n    \"expires_in\": 3600,\n    \"refresh_token\": \"fac32cca7559d9f6e8f1dfe9a99c71fa1dcfeb482bedf287d7934d2667ae54b3\"\n  }\n}\n```\n\nRefresh `access_token` token using `refresh_token` against `/v1/oauth/token` endpoint with `grant_type=refresh_token`\n\n```\ncurl -X POST \\\n  https://api-sandbox.thisisbud.com/v1/oauth/token \\\n  -H 'Content-Type: application/x-www-form-urlencoded' \\\n  -H 'X-Client-Id: {{client_id}}' \\\n  -d 'grant_type=refresh_token&refresh_token={{refresh_token}}'\n```\n\nSuccessful response:\n```\n{\n    \"operation_id\": \"oauth_token_post\",\n    \"data\": {\n        \"access_token\": \"cc0c17e3fd6d2ce94aa091257a3ea393b4f9b5cf3d3e998f07dc9826da86ff94\",\n        \"token_type\": \"bearer\",\n        \"expires_in\": 3600,\n        \"refresh_token\": \"ffc30cca7559d9f6e8f1dfe9a99c71fa1dcfeb482bedf287d7934d2667ae54b3\"\n    }\n}\n```\n"
