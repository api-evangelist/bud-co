                        regularity:
                          frequency: monthly
                          predicted_date_times:
                          - '2023-05-10T10:00:00Z'
                    _links:
                      details: https://domain/insights/v1/actionable/income/late_income/late_income_8789764a-df2f-4589-b550-00bcd0e9cb2c/details
                  totals:
