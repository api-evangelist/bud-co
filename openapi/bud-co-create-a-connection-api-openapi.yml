openapi: 3.2.0
info:
  title: 'Bud API Services: Documentation Create a Connection API'
  version: 2.10.10
  description: '# Overview


    ## Introduction

    Welcome to Bud''s API Platform documentation.'
  contact:
    name: Bud Support
    email: help@thisisbud.com
    url: https://www.thisisbud.com/
  x-logo:
    url: data:image/png;base64,
servers:
- url: https://api-sandbox.thisisbud.com
tags:
- name: Create a Connection
  x-displayName: Create a Connection
  description: 'Create a new connection to an Open Banking provider by using either: (i) Bud''s configurable frontend UI (__Bud Connect__), built to maximise conversion; or (ii) Bud''s individual API endpoints to help you build your own connect flow.'
paths:
  /v1/open-banking/providers:
    get:
      tags:
      - Create a Connection
      summary: Retrieve OB Providers
      description: List the available account providers with their name, icon and maintenance status.
      operationId: open_banking_providers_get
      security:
      - OAuth2: []
      parameters:
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/OBProvidersQueryTypeFilter'
      - $ref: '#/components/parameters/OBProvidersQueryRegionFilter'
      - $ref: '#/components/parameters/OBProvidersQueryScopesFilter'
      responses:
        '200':
          description: List of providers available via Bud's Open Banking Aggregation APIs
          content:
            application/json:
              schema:
                required:
                - operation_id
                - data
                properties:
                  operation_id:
                    $ref: '#/components/schemas/OperationId'
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/OBProvider'
                  metadata:
                    oneOf:
                    - $ref: '#/components/schemas/ResultsMetadata'
                    - type:
                      - object
                      - 'null'
                example:
                  operation_id: open_banking_providers_get
                  data:
                  - provider: barclays
                    display_name: Barclays
                    maintenance_window:
                      start: 2019-08-07T11:48:00+0000
                      end: 2019-08-07T11:00:00+0000
                    maintenance_status: active
                    icon: https://assets.thisisbud.com/example-icon
                    regions:
                    - GBR
                    mobile_only: false
                  - provider: fd
                    display_name: first direct
                    maintenance_window:
                      start: 2019-08-07T11:48:00+0000
                      end: null
                    maintenance_status: active
                    icon: https://assets.thisisbud.com/example-icon
                    regions:
                    - GBR
                    mobile_only: false
                  - provider: halifax
                    display_name: Halifax
                    maintenance_window: null
                    maintenance_status: inactive
                    icon: https://assets.thisisbud.com/example-icon
                    regions:
                    - GBR
                    mobile_only: false
                  - provider: hbos
                    display_name: Bank of Scotland
                    maintenance_window: null
                    maintenance_status: inactive
                    icon: https://assets.thisisbud.com/example-icon
                    regions:
                    - GBR
                    mobile_only: false
                  - provider: hsbc
                    display_name: HSBC
                    maintenance_window: null
                    maintenance_status: inactive
                    icon: https://assets.thisisbud.com/example-icon
                    regions:
                    - GBR
                    mobile_only: false
                  - provider: lloyds
                    display_name: Lloyds
                    maintenance_window: null
                    maintenance_status: inactive
                    icon: https://assets.thisisbud.com/example-icon
                    regions:
                    - GBR
                    mobile_only: false
                  - provider: mns
                    display_name: Marks & Spencer
                    maintenance_window: null
                    maintenance_status: inactive
                    icon: https://assets.thisisbud.com/example-icon
                    regions:
                    - GBR
                    mobile_only: false
                  - provider: nationwide
                    display_name: Nationwide
                    maintenance_window: null
                    maintenance_status: inactive
                    icon: https://assets.thisisbud.com/example-icon
                    regions:
                    - GBR
                    mobile_only: false
                  - provider: natwest
                    display_name: Natwest
                    maintenance_window: null
                    maintenance_status: inactive
                    icon: https://assets.thisisbud.com/example-icon
                    regions:
                    - GBR
                    mobile_only: false
                  - provider: rbs
                    display_name: Royal Bank of Scotland
                    maintenance_window: null
                    maintenance_status: inactive
                    icon: https://assets.thisisbud.com/example-icon
                    regions:
                    - GBR
                    mobile_only: false
                  - provider: santander
                    display_name: Santander
