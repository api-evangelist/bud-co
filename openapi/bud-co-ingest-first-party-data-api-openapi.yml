          - Credit
          - Emergency
          - Pre-Agreed
          - Temporary
    TransactionSettlementV3WebookBody:
      title: Transaction Settlement Webhook Payload
      type: object
      description: 'The payload send to the client defined webhook (via the console) when a Book or Decline settlement task is Completed.

        '
