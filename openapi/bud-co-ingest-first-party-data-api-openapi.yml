            task_id:
              description: The associated task ID
              type: string
              example: 3928aca4-b73c-4f13-a540-1b3759e06d27
            operation_id:
              description: The endpoint ID the operation was related to
              type: string
              example: v2_ingest_transactions_post
            subtask_details:
