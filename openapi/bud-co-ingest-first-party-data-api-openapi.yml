                description: 'The name of the given account holder.

                  Example: `John Smith`

                  '
              relationship:
                type: string
                description: "The relationship that the individual holder has with the account.\nCurrently supported values include (but are not necessarily limited to):\n  - `sole`\n  - `joint`\n  - `delegate`\n  - `unknown`\n"
    Token:
      title: Token
      type: object
