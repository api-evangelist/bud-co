          description: The type of the account
          enum:
          - Business
          - Personal
        account_sub_type:
          type: string
          description: The sub type of the account
          enum:
          - AutoLoan
          - BoatLoan
          - Brokerage
          - BusinessLoan
          - CertificateOfDeposit
          - ChargeCard
          - CheckingAccount
          - CreditCard
          - CurrentAccount
          - DisabilityInsurance
          - EMoney
          - HealthInsurance
          - HomeEquityLoan
          - Investment
          - Ira
          - LiabilityInsurance
          - LifeInsurance
          - LineOfCredit
          - Loan
          - MoneyMarket
          - Mortgage
          - Other
          - PersonalLoan
          - PrePaidCard
          - PropertyInsurance
          - Roth
          - RvLoan
          - Savings
          - StudentLoan
          - TravelInsurance
          - VehicleInsurance
        holder_name:
          type: string
          description: The name of the account holder
        details:
          deprecated: true
          type: array
          description: Provides the details to identify an account
          items:
            $ref: '#/components/schemas/IngestAccountDetails'
        account_identifiers:
          type: array
          description: Provides the details to identify an account
          items:
            $ref: '#/components/schemas/IngestAccountIdentifiers'
        balances:
