                        accounts[0].currency: 'unexpected currency code: GlkjlkjBP, expected ISO-4217 currency code'
                    metadata:
                      task_id: 3d592efc-493a-4548-8008-f738fd0877ab
                      status: Failed
                      result: data_mapping_error
