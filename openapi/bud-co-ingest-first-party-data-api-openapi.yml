  parameters:
    GenerateTransactionIDs:
      in: header
      name: X-Generate-Transaction-IDs
      schema:
        type: string
        enum:
        - 'true'
      example: 'true'
      description: 'Enable transaction ID generation based on the contents of the transaction data. The transaction ID field still needs to be provided, but it will not be validated or checked for uniqueness and instead overwritten with a generated value.

        When generating IDs from transaction data, the following fields are taken into account: account ID, description, amount, currency and date.

        '
    SigningIdHeaderParameter:
      in: header
      name: X-Signing-ID
      description: The public key ID which should be used to verify the X-Signature header. Bud's list of public keys can be found at https://assets.thisisbud.com/bud-callback.jwks
      required: true
      schema:
        type: string
    DisableSynchronous:
      in: header
      name: X-Disable-Synchronous
      description: 'If provided as true, the task will **not** be processed synchronously.


        If false or the header is not included, the task **will** be processed synchronously.

        '
      schema:
        type: boolean
    SignatureHeaderParameter:
      in: header
      name: X-Signature
      description: The signed request body JWT
      required: true
      schema:
        type: string
    NoCustomerHeader:
      in: header
      name: X-No-Customer
      schema:
        type: boolean
      description: 'If provided as true, the customer_id is not required in the request. This is only available with X-Disable-Synchronous not set or set to false.

